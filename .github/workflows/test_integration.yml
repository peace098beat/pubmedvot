name: Test

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests (no API)
        # Exit code 5 = no tests collected. Currently there are no
        # non-api tests; treat that as success rather than failure so this
        # job stays green until pure-logic unit tests are added.
        run: uv run pytest tests/ -v -m "not api" || test $? -eq 5

  api:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run API connectivity tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          # GITHUB_ACTIONS=true is auto-injected by GitHub; conftest.py uses it
          # to switch into force-run mode (missing keys => fail, not skip).
        run: uv run pytest tests/ -v -m "api"
